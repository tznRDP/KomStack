  #      resolution: 4K

  ######################################################
  # 🟣 TV-SHOWS                                        #
  ######################################################

  NetflixSeries:
    tmdb_network: 213
    overlay:
      name: NSeries
      url: https://raw.githubusercontent.com/tznRDP/PlexStack/refs/heads/main/NSeries_White.png

  NewSeason:
    overlay:
      name: NewSeason
      url: https://raw.githubusercontent.com/Entree3k/Plex/refs/heads/main/Plex%20Meta%20Manager%20Configs/Overlays/images/new_season2.png
      group: FRESH
      weight: 900
    plex_all: true
    filters:
      added.not: 30
      seasons:
        percentage: 1
        added: 21
        title.not: Specials

  Airing:
    overlay:
      name: airing
      url: https://raw.githubusercontent.com/Entree3k/Plex/refs/heads/main/Plex%20Meta%20Manager%20Configs/Overlays/images/Status/Lower%20Small/airing_small.png
      group: STATUS
      weight: 950
    tmdb_on_the_air: 2000

  Returning:
    overlay:
      name: returning
      url: https://raw.githubusercontent.com/Entree3k/Plex/refs/heads/main/Plex%20Meta%20Manager%20Configs/Overlays/images/Status/Lower%20Small/returning_small.png
      group: STATUS
      weight: 800
    plex_all: true
    filters:
      tmdb_status:
        - returning
        - planned
        - production

  Ended:
    overlay:
      name: ended
      url: https://raw.githubusercontent.com/Entree3k/Plex/refs/heads/main/Plex%20Meta%20Manager%20Configs/Overlays/images/Status/Lower%20Small/ended_small.png
      group: STATUS
      weight: 700
    plex_all: true
    filters:
      tmdb_status: ended

  Canceled:
    overlay:
      name: canceled
      url: https://raw.githubusercontent.com/Entree3k/Plex/refs/heads/main/Plex%20Meta%20Manager%20Configs/Overlays/images/Status/Lower%20Small/canceled_small.png
      group: STATUS
      weight: 600
    plex_all: true
    filters:
      tmdb_status: canceled

