#=======================================================================#
#  Studio collections, loaded by BOTH the Movies and TV Shows libraries #
#  Lives at: Kometa/Collections/Studios.yml                             #
#=======================================================================#

#####################################
#     Custom Collection Templates   #
#####################################
templates:

  Original:
    sort_title: "!AAA <<collection_name>>"
    collection_order: release
    collection_mode: hide

  Studios:
    sort_title: "!AAB <<collection_name>>"
    collection_order: release
    collection_mode: hide

collections:
  # Originals
  Netflix Originals:
    template: { name: Original }
    tmdb_company:
      - https://www.themoviedb.org/company/178464
      - https://www.themoviedb.org/company/198834-netflix
      - https://www.themoviedb.org/company/185004
      - https://www.themoviedb.org/company/171251-netflix-animation
      - https://www.themoviedb.org/company/145174
    trakt_list:
      - https://trakt.tv/users/k0meta/lists/netflix-originals?sort=rank,asc
    filters:
      title.not:
        - Our Planet (2019)
    summary: "Feature films by Netflix"
    collection_order: alpha
    url_poster: https://theposterdb.com/api/assets/597068

  Disney+ Originals:
    template: { name: Original }
    trakt_list:
      - https://trakt.tv/users/k0meta/lists/disney-originals?sort=rank,asc
    summary: "Feature films by Disney+"
    collection_order: alpha
    url_poster: https://theposterdb.com/api/assets/584351

  AppleTV+ Originals:
    template: { name: Original }
