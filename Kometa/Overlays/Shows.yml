  # The studio's logo at the bottom, as on the posters of the Marvel and DC
  # shows: one per show, and when a show matches more than one line, the
  # highest weight wins. Shows go by TMDb id (themoviedb.org/tv/<id>), so a
  # new one is one more line in its list.
  #   Dark        the black logo, for light posters
  #   No Studio   no logo, for posters that already show it
  # The logos are the movies' ones (Overlays/Studios), placed a little higher.

  # MARVEL TELEVISION: Marvel's live-action shows from 2024 on, and the
  # Marvel Television shows before them
