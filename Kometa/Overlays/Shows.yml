  # One logo per show, top left. Plex's network field picks the logo, a line
  # can also add shows by title or TVDB id, and when a show matches more than
  # one line, the highest weight wins.
  # Shows labelled Dark get the black logo, shows labelled Color the colour
  # one where the network has a Color line, and shows labelled both the Color
  # Dark one (see the templates at the top).
  # New logo: put the original in Overlays/Networks/<Network>/Source/, add it
  # to build.py there and run it (see the README), then add a pair of lines.

  # BBC Earth isn't a network in Plex (these are BBC One and friends there), so
  # it goes by TVDB id: the shows in the BBC Earth section of Metadata/Shows.yml.
  # A Perfect Planet, The Blue Planet, Blue Planet II, Dynasties, Frozen Planet,
  # Frozen Planet II, Our Planet, Planet Earth, Planet Earth II, Planet Earth III,
  # Prehistoric Planet, Seven Worlds One Planet, The Green Planet
  BBC Earth:
    template: {name: NetworkLogo, folder: BBC Earth, file: BBCEarth, weight: 200, tvdb: &bbcearth [359365, 74372, 330942, 352054, 251418, 417395, 355229, 79257, 318408, 413197, 418505, 359251, 359250]}
  BBC Earth Dark:
