#=======================================================================#
#  TV overlays, loaded by the TV Shows library                          #
#  Lives at: Kometa/Overlays/Shows.yml                                  #
#-----------------------------------------------------------------------#
#  Overlay images live in Kometa/Overlays/Networks/<Network>/.          #
#=======================================================================#

templates:
  # Network logos (see the NETWORKS section). The logo images are full-size
  # 1000x1500 PNGs with the logo already placed top left.
  #
  # Every show on the network gets the white logo. Label a show Dark (light
  # poster) for the black one, or Color for the colour one on networks that
  # have a Color line. Both labels give the colour logo with black text where
  # there's a Color Dark line (Prime Video, Peacock), and the colour one
  # elsewhere. Each template adds a digit to the weight, so for weight 96:
  # 960 white, 961 Dark, 962 Color, 963 Color + Dark. A label always beats
  # the plain logo, and Color on a network with no colour logo just keeps the
  # plain one.
  #
  # Optional, for logos that aren't a Plex network or need a few extra shows:
  #   tvdb:        shows by TVDB id
  #   add_titles:  shows added by title
  #   skip_titles: shows left out by title
  # validate is only set when there's a network or title to search for, so a
  # line with just tvdb ids skips the Plex search altogether.
  NetworkLogo:          # white logo
    optional: [network, tvdb, add_titles, skip_titles]
    conditionals:
      validate:
        conditions:
          - network.exists: true
            value: false
          - add_titles.exists: true
            value: false
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Networks/<<folder_encoded>>/Label/<<file>>_White.png
      group: network
      weight: <<weight>>0
    plex_search:
      validate: <<validate>>  # false: skip network names this library doesn't have
      any:
        network: <<network>>
        title: <<add_titles>>
    tvdb_show: <<tvdb>>
    filters:
      title.not: <<skip_titles>>

  NetworkLogoDark:      # black logo, shows labelled Dark
    optional: [network, tvdb, add_titles, skip_titles]
    conditionals:
      validate:
        conditions:
          - network.exists: true
            value: false
          - add_titles.exists: true
            value: false
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Networks/<<folder_encoded>>/Label/<<file>>_Black.png
      group: network
      weight: <<weight>>1
    plex_search:
      validate: <<validate>>
      any:
        network: <<network>>
        title: <<add_titles>>
    tvdb_show: <<tvdb>>
    filters:
      label: Dark
      title.not: <<skip_titles>>

  NetworkLogoColor:     # colour logo, shows labelled Color
    optional: [network, tvdb, add_titles, skip_titles]
    conditionals:
      validate:
        conditions:
          - network.exists: true
            value: false
          - add_titles.exists: true
            value: false
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Networks/<<folder_encoded>>/Label/<<file>>_Color.png
      group: network
      weight: <<weight>>2
    plex_search:
      validate: <<validate>>
      any:
        network: <<network>>
        title: <<add_titles>>
    tvdb_show: <<tvdb>>
    filters:
      label: Color
      title.not: <<skip_titles>>

  NetworkLogoColorDark: # colour logo with black text, shows labelled Color and Dark
    optional: [network, tvdb, add_titles, skip_titles]
    conditionals:
      validate:
        conditions:
          - network.exists: true
            value: false
          - add_titles.exists: true
            value: false
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Networks/<<folder_encoded>>/Label/<<file>>_ColorDark.png
      group: network
      weight: <<weight>>3
    plex_search:
      validate: <<validate>>
      any:
        network: <<network>>
        title: <<add_titles>>
    tvdb_show: <<tvdb>>
    filters:
      label: Color
      label.regex: ^Dark$   # and Dark (a filter can only name label once)
      title.not: <<skip_titles>>

  TintedLogo:           # one show's logo in its own colour (see the TINTED section)
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Networks/<<folder_encoded>>/Tinted/<<file>>.png
      group: network
      weight: 3000
    tvdb_show: <<tvdb>>

  # Studio logos (see the STUDIOS section), centred at the bottom just above
  # the Airing/Returning tab. The images are full-size 1000x1500 PNGs with the
  # logo already placed. Label a show Dark for the black logo, or No Studio if
  # its poster already shows the logo. They share the FRESH group with New
  # Season, whose tab sits higher, so a show's logo steps aside while it has
  # that tab and comes back after.
  #   company:  TMDb company ids (themoviedb.org/company/<id>)
  #   tmdb:     shows by TMDb id (themoviedb.org/tv/<id>)
  StudioLogo:           # white logo
    optional: [company, tmdb]
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Studios/<<folder_encoded>>/Shows/<<file>>_White.png
      group: FRESH
      weight: <<weight>>0
    tmdb_company: <<company>>
    tmdb_show: <<tmdb>>
    filters:
      label.not: No Studio

  StudioLogoDark:       # black logo, shows labelled Dark
    optional: [company, tmdb]
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Studios/<<folder_encoded>>/Shows/<<file>>_Black.png
      group: FRESH
      weight: <<weight>>1
    tmdb_company: <<company>>
    tmdb_show: <<tmdb>>
    filters:
      label: Dark
      label.not: No Studio

  # Episode badges (see the EPISODE OVERLAYS section). Bookends labels the
  # episodes; each overlay puts the badge for its label on the title card.
  # The badges are full-size 1920x1080 PNGs with the badge at the bottom.
  EpisodeBadge:
    builder_level: episode
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Episodes/<<file>>.png
      group: episode_badge
      weight: <<weight>>
    plex_search:
      validate: false     # skip labels Bookends hasn't used yet
      all:
        episode_label: <<overlay_name>>

