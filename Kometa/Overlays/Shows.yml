  # Premiere and finale badges on episode title cards. Bookends (its own
  # container) labels the episodes from TheTVDB or TMDb data, whichever the
  # show's episode ordering in Plex uses, and each overlay here matches one
  # label. Specials and excluded shows (Beck) get no labels.
  # If an episode somehow has two labels, the higher weight wins.

  Series Premiere:
    template: {name: EpisodeBadge, file: series_premiere, weight: 40}

  Season Premiere:
    template: {name: EpisodeBadge, file: season_premiere, weight: 30}

  Mid-Season Finale:
    template: {name: EpisodeBadge, file: midseason_finale, weight: 10}

  Season Finale:
    template: {name: EpisodeBadge, file: season_finale, weight: 20}

  Series Finale:
    template: {name: EpisodeBadge, file: series_finale, weight: 50}
