#=======================================================================#
#  Movie overlays, loaded by the Movies library                         #
#  Lives at: Kometa/Overlays/Movies.yml                                 #
#=======================================================================#

templates:
  # Streaming-originals logos, same images and Dark rule as the show logos.
  StudioLogo:           # white logo, movies not labelled Dark
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Networks/<<folder_encoded>>/Label/<<file>>_White.png
      group: topleft
      weight: <<weight>>
    tmdb_company: <<company>>
    filters:
      label.not: Dark

  StudioLogoDark:       # black logo, movies labelled Dark (light posters)
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Networks/<<folder_encoded>>/Label/<<file>>_Black.png
      group: topleft
      weight: <<weight>>
    tmdb_company: <<company>>
    filters:
      label: Dark

