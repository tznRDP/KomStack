    plex_search:
      all:
        collection: Festival de Cannes Palme d'Or

  ######################################################
  # 🔵 STREAMING ORIGINALS (top left)
  ######################################################
  # Was the Netflix / AppleTV+ / Amazon Originals collections. Same TMDb
  # companies, now a logo on the poster instead.
  Netflix:
    template: {name: StudioLogo, folder: Netflix, file: Netflix, weight: 90, company: &netflix [178464, 198834, 185004, 171251, 145174]}
  Netflix Dark:
    template: {name: StudioLogoDark, folder: Netflix, file: Netflix, weight: 90, company: *netflix}

  Apple TV:
    template: {name: StudioLogo, folder: Apple TV, file: AppleTV, weight: 89, company: &appletv [194232]}
  Apple TV Dark:
    template: {name: StudioLogoDark, folder: Apple TV, file: AppleTV, weight: 89, company: *appletv}

  Prime Video:
    template: {name: StudioLogo, folder: Prime Video, file: PrimeVideo, weight: 88, company: &primevideo [210099]}
  Prime Video Dark:
    template: {name: StudioLogoDark, folder: Prime Video, file: PrimeVideo, weight: 88, company: *primevideo}
