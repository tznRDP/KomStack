  ######################################################
  # 🟣 STUDIOS
  ######################################################
  # The studio's logo at the bottom, as on the posters: one per movie, and when
  # a movie matches more than one line, the highest weight wins.
  #   Dark        the black logo, for light posters (white parts inside a
  #               coloured shape stay white, like MARVEL in its red box)
  #   No Studio   no logo, for posters that already show it
  # New logo: put the original in Overlays/Studios/<Studio>/Source/, add it to
  # build.py there and run it (see the README), then add a pair of lines.

  # MARVEL TELEVISION on Marvel Television's specials
  Marvel Television:
    template:
      name: StudioLogo
      folder: Marvel Television
      file: MarvelTelevision
      weight: 59
      tmdb: &marvel_tv
        - 1439930   # The Punisher: One Last Kill (2026)
  Marvel Television Dark:
    template: {name: StudioLogoDark, folder: Marvel Television, file: MarvelTelevision, weight: 59, tmdb: *marvel_tv}

  # MARVEL STUDIOS on the MCU: Marvel Studios' movies that are in one of the
  # MCU Phase collections (Collections/Movies.yml), so a new phase counts too
  Marvel Studios:
    template: {name: StudioLogo, folder: Marvel Studios, file: MarvelStudios, weight: 58, company: &marvel [420], collection: &mcu "^MCU Phase"}
  Marvel Studios Dark:
    template: {name: StudioLogoDark, folder: Marvel Studios, file: MarvelStudios, weight: 58, company: *marvel, collection: *mcu}

  # DC STUDIOS on the DCU, the universe that started with Superman (2025).
  # Add new DCU movies here by TMDb id.
  DC Studios:
    template:
      name: StudioLogo
      folder: DC Studios
      file: DCStudios
      weight: 57
      tmdb: &dcu
        - 1061474   # Superman (2025)
        - 1081003   # Supergirl (2026)
        - 1400940   # Clayface (2026)
  DC Studios Dark:
    template: {name: StudioLogoDark, folder: DC Studios, file: DCStudios, weight: 57, tmdb: *dcu}

  # The DC roundel on every other DC movie: DC Studios, and the names DC made
  # its movies under before (DC Films, DC Entertainment, DC Comics)
  DC:
    template: {name: StudioLogo, folder: DC, file: DC, weight: 56, company: &dc [184898, 128064, 9993, 429]}
  DC Dark:
    template: {name: StudioLogoDark, folder: DC, file: DC, weight: 56, company: *dc}

  # LUCASFILM on Star Wars: Lucasfilm's movies with one of these in the title
  # (Episodes V and VI are just The Empire Strikes Back and Return of the Jedi),
  # so Indiana Jones and the rest go without
  Lucasfilm:
    template: {name: StudioLogo, folder: Lucasfilm, file: Lucasfilm, weight: 55, company: &lucasfilm [1], titles: &star_wars [Star Wars, Empire Strikes Back, Return of the Jedi, Mandalorian]}
  Lucasfilm Dark:
    template: {name: StudioLogoDark, folder: Lucasfilm, file: Lucasfilm, weight: 55, company: *lucasfilm, titles: *star_wars}

  # The Disney · PIXAR logo the Pixar posters carry
  Pixar:
    template: {name: StudioLogo, folder: Pixar, file: DisneyPixar, weight: 54, company: &pixar [3]}
  Pixar Dark:
    template: {name: StudioLogoDark, folder: Pixar, file: DisneyPixar, weight: 54, company: *pixar}

  # The Disney logo, on Walt Disney Animation Studios' movies and the earlier
  # ones made as Walt Disney Feature Animation, Walt Disney Animation and Walt
  # Disney Productions. The Animation genre keeps Walt Disney Productions'
  # live-action movies out.
  Walt Disney Animation Studios:
    template: {name: StudioLogo, folder: Walt Disney Animation Studios, file: Disney, weight: 53, company: &wdas [6125, 171656, 177000, 3166], genre: &wdas_genre Animation}
  Walt Disney Animation Studios Dark:
    template: {name: StudioLogoDark, folder: Walt Disney Animation Studios, file: Disney, weight: 53, company: *wdas, genre: *wdas_genre}

