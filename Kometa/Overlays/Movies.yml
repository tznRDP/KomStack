#=======================================================================#
#  Movie overlays, loaded by the Movies library                         #
#  Lives at: Kometa/Overlays/Movies.yml                                 #
#=======================================================================#

templates:
  # The Oscars Best Picture badge at the top (see the OSCARS section). The
  # images are full-size 1000x1500 PNGs with the badge already placed, one per
  # ceremony year and gold. Kometa finds that year's winner from IMDb's Oscars
  # data, and the movie's label in Plex picks the badge: Oscars for the gold
  # one, Oscars Dark for the darker gold (with both, the darker gold).
  BestPicture:
    default:
      event: <<year>>     # IMDb's name for the ceremony, if it isn't just the year
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Awards/Oscars/BestPicture/<<year>>_Gold.png
    imdb_award:
      event_id: ev0000003
      event_year: <<event>>
      category_filter:
        - best motion picture of the year
        - best picture
        - best picture, production
        - best picture, unique and artistic production
      winning: true
    filters:
      label: Oscars
      label.not: Oscars Dark

  BestPictureDark:
    default:
      event: <<year>>
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Awards/Oscars/BestPicture/<<year>>_Dark.png
    imdb_award:
      event_id: ev0000003
      event_year: <<event>>
      category_filter:
        - best motion picture of the year
        - best picture
        - best picture, production
        - best picture, unique and artistic production
      winning: true
    filters:
      label: Oscars Dark

  # Studio logos (see the STUDIOS section), centred at the bottom under the
  # title. The images are full-size 1000x1500 PNGs with the logo already placed.
  # Kometa finds the studio's movies on TMDb, which lists every company behind
  # a movie (Plex only shows one). Label a movie Dark in Plex for the black
  # logo, or No Studio if its poster already shows the logo. In a movie's first
  # week the Recently Added tab sits there instead, so the logo waits.
  #   company:     TMDb company ids (themoviedb.org/company/<id>)
  #   tmdb:        movies by TMDb id (themoviedb.org/movie/<id>)
  #   collection:  only movies in a Plex collection whose name matches this
  #                (a regex: ^MCU Phase is every name starting MCU Phase)
  #   titles:      only movies with one of these in the title
  #   genre:       only movies in this Plex genre
  StudioLogo:          # white logo
    optional: [company, tmdb, collection, titles, genre]
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Studios/<<folder_encoded>>/Movies/<<file>>_White.png
      group: studio
      weight: <<weight>>0
    tmdb_company: <<company>>
    tmdb_movie: <<tmdb>>
    filters:
      label.not: No Studio
      added.not: 7
      collection.regex: <<collection>>
      title: <<titles>>
      genre: <<genre>>

  StudioLogoDark:      # black logo, movies labelled Dark
    optional: [company, tmdb, collection, titles, genre]
    ignore_blank_results: true
    overlay:
      name: <<overlay_name>>
      url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Overlays/Studios/<<folder_encoded>>/Movies/<<file>>_Black.png
      group: studio
      weight: <<weight>>1
    tmdb_company: <<company>>
    tmdb_movie: <<tmdb>>
    filters:
      label: Dark
      label.not: No Studio
      added.not: 7
      collection.regex: <<collection>>
      title: <<titles>>
      genre: <<genre>>

