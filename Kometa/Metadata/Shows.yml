#=======================================================================#
#  Show metadata                                                        #
#  Lives at: Kometa/Metadata/Shows.yml                                  #
#-----------------------------------------------------------------------#
#  Each show is 4 lines. Template name picks the behaviour:              #
#    Seasons#  = season art only (Aura handles the show poster/bg)       #
#    Art#      = show art + season art (Kometa handles everything)       #
#  The number is the season count.                                       #
#                                                                        #
#  "folder" is the folder name under Kometa/Metadata/Shows/ —            #
#  write it plainly, Kometa URL-encodes it.                              #
#                                                                        #
#  Point config.yml at this file:                                        #
#    libraries:                                                          #
#      TV Shows:                                                         #
#        metadata_files:                                                 #
#          - url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Metadata/Shows.yml
#=======================================================================#

external_templates:
  - url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/templates.yml

metadata:

  # 4 seasons. Show poster/background set by Aura, so season art only.
  Monster (2022):
    match:
      title: Monster
      year: 2022
    template: {name: Seasons4, folder: "Monster (2022)"}

  # 3 seasons (The Terror, Infamy, Devil in Silver).
  # Show poster/background set by Aura, so season art only.
  The Terror (2018):
    match:
      title: The Terror
      year: 2018
    template: {name: Seasons3, folder: "The Terror (2018)"}

#-----------------------------------------------------------------------#
#  Examples — uncomment once the art is actually in the repo, otherwise  #
