#=======================================================================#
#  TV show metadata, loaded by the TV Shows library                     #
#  Lives at: Kometa/Metadata/Shows.yml                                  #
#-----------------------------------------------------------------------#
#  ONE ENTRY PER SHOW, keyed by its TVDB id. Kometa skips a duplicate   #
#  id entirely, so all art for a show goes in its one entry.            #
#                                                                       #
#  Repo-hosted season art can use a template from Kometa/templates.yml: #
#    322191:  # The Terror (2018)                                       #
#      template: {name: Seasons3, folder: "The Terror (2018)"}          #
#  Seasons# = season art only, Art# = show + season art. The number is  #
#  the season count, "folder" the folder under Kometa/Metadata/Shows/.  #
#                                                                       #
#  Sections: art hosted in this repo / MediUX and ThePosterDB sets /    #
#            BBC Earth posters (inactive, commented out)                #
#=======================================================================#

external_templates:
  - url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/templates.yml

metadata:

