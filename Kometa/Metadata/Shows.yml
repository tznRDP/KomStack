#=======================================================================#
#  Show metadata                                                        #
#  Lives at: Kometa/Metadata/Shows.yml                                  #
#-----------------------------------------------------------------------#
#  Each show is 2 lines. The key is the show's TVDB id, so matching     #
#  is exact — no title/year guessing:                                   #
#                                                                       #
#    389492:  # Show Name (Year)                                        #
#      template: {name: Seasons4, folder: "Show Name (Year)"}           #
#                                                                       #
#  Template name picks the behaviour:                                   #
#    Seasons#  = season art only (show poster/bg handled elsewhere)     #
#    Art#      = show art + season art (Kometa handles everything)      #
#  The number is the season count.                                      #
#                                                                       #
#  "folder" is the folder name under Kometa/Metadata/Shows/ —           #
#  write it plainly, Kometa URL-encodes it.                             #
#                                                                       #
#  Loaded from config.yml:                                              #
#    libraries:                                                         #
#      TV Shows:                                                        #
#        metadata_files:                                                #
#          - url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/Metadata/Shows.yml
#=======================================================================#

external_templates:
  - url: https://raw.githubusercontent.com/tznRDP/KomStack/main/Kometa/templates.yml

metadata:

  389492:  # Monster (2022) — 4 seasons
    template: {name: Seasons4, folder: "Monster (2022)"}

  322191:  # The Terror (2018) — 3 seasons: The Terror, Infamy, Devil in Silver
    template: {name: Seasons3, folder: "The Terror (2018)"}

#-----------------------------------------------------------------------#
#  Adding a show: copy this, uncomment, fill in the TVDB id + folder.   #
#-----------------------------------------------------------------------#

#  123456:  # Show Name (Year)
#    template: {name: Seasons4, folder: "Show Name (Year)"}
